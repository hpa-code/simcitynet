<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title>SimCityNet pipeline: one street image to five interpretable blocks, a 33-dimensional vector, and pairwise similarity</title>
  <rect width="1200" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8985"/>
    </marker>
  </defs>

  <!-- input image -->
  <g transform="translate(30,120)">
    <rect width="180" height="130" rx="10" fill="#cde2fb"/>
    <rect y="62" width="180" height="68" rx="0" fill="#c8beaa"/>
    <rect y="92" width="180" height="38" fill="#5a5a5a"/>
    <rect x="96" y="22" width="70" height="44" fill="#b4785a"/>
    <circle cx="40" cy="44" r="24" fill="#1baf7a"/>
    <rect x="37" y="60" width="6" height="14" fill="#6b4f2a"/>
    <rect x="58" y="78" width="7" height="18" rx="3" fill="#2a78d6"/>
    <rect x="120" y="98" width="40" height="18" rx="5" fill="#eb6834"/>
    <rect width="180" height="130" rx="10" fill="none" stroke="#e4e3df" stroke-width="2"/>
    <text x="90" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Street image</text>
    <text x="90" y="178" text-anchor="middle" font-size="12" fill="#52514e">photo, panorama or video frame</text>
  </g>

  <line x1="222" y1="185" x2="262" y2="185" stroke="#8a8985" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- blocks -->
  <g font-size="13">
    <g transform="translate(272,28)">
      <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
      <rect width="8" height="62" rx="4" fill="#1baf7a"/>
      <text x="24" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Vegetation</text>
      <text x="24" y="47" fill="#52514e">Mask2Former (ADE20K) + colour filter, DPT depth weighting</text>
      <text x="452" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#0b0b0b">1</text>
    </g>
    <g transform="translate(272,100)">
      <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
      <rect width="8" height="62" rx="4" fill="#e87ba4"/>
      <text x="24" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Colour palette</text>
      <text x="24" y="47" fill="#52514e">K-means, 5 dominant colours (RGB) and their pixel shares</text>
      <text x="452" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#0b0b0b">20</text>
    </g>
    <g transform="translate(272,172)">
      <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
      <rect width="8" height="62" rx="4" fill="#2a78d6"/>
      <text x="24" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Pedestrians</text>
      <text x="24" y="47" fill="#52514e">YOLOv9e person count</text>
      <text x="452" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#0b0b0b">1</text>
    </g>
    <g transform="translate(272,244)">
      <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
      <rect width="8" height="62" rx="4" fill="#eb6834"/>
      <text x="24" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Vehicles and other moving objects</text>
      <text x="24" y="47" fill="#52514e">YOLOv9e: cars, buses, trucks, bikes, motorbikes, trains, boats…</text>
      <text x="452" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#0b0b0b">8</text>
    </g>
    <g transform="translate(272,316)">
      <rect width="470" height="62" rx="8" fill="#ffffff" stroke="#e4e3df" stroke-width="1.5"/>
      <rect width="8" height="62" rx="4" fill="#eda100"/>
      <text x="24" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Surfaces</text>
      <text x="24" y="47" fill="#52514e">Mask2Former (Cityscapes): road, sidewalk, building shares</text>
      <text x="452" y="38" text-anchor="end" font-size="20" font-weight="700" fill="#0b0b0b">3</text>
    </g>
  </g>

  <line x1="752" y1="203" x2="796" y2="203" stroke="#8a8985" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 33-D vector: segment heights proportional to 1, 20, 1, 8, 3 (10 px per dimension) -->
  <g transform="translate(806,38)">
    <rect x="0" y="0" width="34" height="9" fill="#1baf7a"/>
    <rect x="0" y="11" width="34" height="198" fill="#e87ba4"/>
    <rect x="0" y="211" width="34" height="9" fill="#2a78d6"/>
    <rect x="0" y="222" width="34" height="78" fill="#eb6834"/>
    <rect x="0" y="302" width="34" height="28" fill="#eda100"/>
    <text x="17" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">33-D</text>
    <text x="17" y="374" text-anchor="middle" font-size="12" fill="#52514e">vector</text>
  </g>

  <line x1="852" y1="203" x2="896" y2="203" stroke="#8a8985" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- similarity matrix -->
  <g transform="translate(910,70)">
    <g>
      <rect x="0" y="0" width="44" height="44" fill="#0d366b"/><rect x="46" y="0" width="44" height="44" fill="#3987e5"/><rect x="92" y="0" width="44" height="44" fill="#9ec5f4"/><rect x="138" y="0" width="44" height="44" fill="#6da7ec"/>
      <rect x="0" y="46" width="44" height="44" fill="#3987e5"/><rect x="46" y="46" width="44" height="44" fill="#0d366b"/><rect x="92" y="46" width="44" height="44" fill="#cde2fb"/><rect x="138" y="46" width="44" height="44" fill="#86b6ef"/>
      <rect x="0" y="92" width="44" height="44" fill="#9ec5f4"/><rect x="46" y="92" width="44" height="44" fill="#cde2fb"/><rect x="92" y="92" width="44" height="44" fill="#0d366b"/><rect x="138" y="92" width="44" height="44" fill="#256abf"/>
      <rect x="0" y="138" width="44" height="44" fill="#6da7ec"/><rect x="46" y="138" width="44" height="44" fill="#86b6ef"/><rect x="92" y="138" width="44" height="44" fill="#256abf"/><rect x="138" y="138" width="44" height="44" fill="#0d366b"/>
    </g>
    <text x="91" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Pairwise similarity</text>
    <text x="91" y="232" text-anchor="middle" font-size="12" fill="#52514e">cosine · Euclidean · colour EMD</text>
    <text x="91" y="262" text-anchor="middle" font-size="12" fill="#52514e">+ scene cards, maps, radar charts</text>
  </g>
</svg>
