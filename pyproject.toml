[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simcitynet"
dynamic = ["version"]
description = "Interpretable 33-dimensional scene embeddings and pairwise similarity for street-level images (SimCityNet)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cantay Caliskan" },
  { name = "Abylay Iskakov" },
  { name = "Yuanzhu Li" },
  { name = "Brendan McCollum" },
  { name = "Yi Ren" },
]
keywords = [
  "urban-analytics",
  "street-view",
  "image-embedding",
  "computer-vision",
  "generative-ai-audit",
  "algorithmic-fairness",
  "computational-social-science",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "typer>=0.12",
]

[project.optional-dependencies]
models = [
  "torch>=2.2",
  "transformers>=4.40,<6",
]
yolo = [
  "ultralytics>=8.3",
]
all = [
  "simcitynet[models,yolo]",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-jupyter>=0.24",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.0",
  "build>=1.2",
  "twine>=5",
  "nbformat>=5.9",
  "simcitynet[docs]",
]

[project.scripts]
simcitynet = "simcitynet.cli:app"

[project.urls]
Homepage = "https://hpa-code.github.io/simcitynet/"
Documentation = "https://hpa-code.github.io/simcitynet/"
Repository = "https://github.com/hpa-code/simcitynet"
Issues = "https://github.com/hpa-code/simcitynet/issues"
Changelog = "https://github.com/hpa-code/simcitynet/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.2139/ssrn.5369073"

[tool.hatch.version]
path = "src/simcitynet/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/simcitynet",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "MODEL_LICENSES.md",
  "CONTRIBUTING.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simcitynet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "NPY"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]

[tool.mypy]
files = ["src/simcitynet"]
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error", "ignore::DeprecationWarning:typer.*"]
log_level = "INFO"
markers = [
  "slow: downloads and runs the real models (needs the [all] extra and internet; GPU recommended)",
]

[tool.coverage.run]
source = ["simcitynet"]
branch = true
omit = [
  # Thin adapters around third-party models; exercised by the `slow` tests instead.
  "*/simcitynet/backends/huggingface.py",
  "*/simcitynet/backends/yolo.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.repo-review]
ignore = [
  "RTD",    # docs are hosted on GitHub Pages, not Read the Docs
  "PP006",  # development dependencies are the documented `dev` extra (pip install -e ".[dev]")
  "PC180",  # no Markdown formatter: docs prose is hand-formatted
]
